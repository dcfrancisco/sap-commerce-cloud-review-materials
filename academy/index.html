<!doctype html><html><head><meta charset="utf-8"><title>SAP Commerce Academy</title><style>body{font:16px system-ui;max-width:980px;margin:40px auto;padding:0 20px;color:#20242a}button{padding:10px 14px;margin:4px;border:1px solid #789;border-radius:6px;background:#eef5ff}pre{white-space:pre-wrap;background:#f5f6f8;padding:16px;border-radius:8px;max-height:480px;overflow:auto}.tag{display:inline-block;background:#e2f2e8;padding:4px 8px;border-radius:12px;margin-right:6px}</style></head><body><h1>AI-Native SAP Commerce Cloud Academy</h1><p><span class="tag">local-first</span><span class="tag">M01 vertical slice</span><span class="tag">simulation clearly labeled</span></p><p>This learner shell demonstrates a real lesson → practice → evidence flow. It does not claim to be SAP Commerce runtime or Athena Hub.</p><button onclick="loadModule()">Read M01</button><button onclick="runLab()">Run catalog lab</button><button onclick="loadAssessment()">Open assessment</button><pre id="out">Choose an activity.</pre><script>async function get(u,o){let r=await fetch(u,o);return r.json()} async function loadModule(){let x=await get('/api/module/M01');document.querySelector('#out').textContent=x.markdown} async function runLab(){await get('/api/simulation/reset',{method:'POST'});let a=await get('/api/simulation/products/P100');await get('/api/simulation/scenarios/stale-projection',{method:'POST'});let b=await get('/api/simulation/products/P100');document.querySelector('#out').textContent=JSON.stringify({baseline:a,staleScenario:b},null,2)} async function loadAssessment(){let x=await get('/api/assessments/M01');document.querySelector('#out').textContent=x.items.map(i=>i.id+' — '+i.prompt+'\nRubric: '+JSON.stringify(i.rubric)).join('\n\n')}</script></body></html>
